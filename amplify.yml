version: 1
applications:
  - appRoot: ledger-app
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install
            # Inject Amplify Console environment variables into .env.production for Next.js SSR / API routes
            - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_)' >> .env.production
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
